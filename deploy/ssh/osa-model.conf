# Modelo de /etc/osa/ssh_config (TASK-113): a conta osa da Core abre só o túnel do modelo.
# Instalar: sudo install -o osa -g osa -m 600 deploy/ssh/osa-model.conf /etc/osa/ssh_config e
# trocar HostName e User. A chave nasce na Core:
#   sudo -u osa ssh-keygen -t ed25519 -N "" -C osa-model-tunnel -f /etc/osa/model_ed25519
# e entra no ~/.ssh/authorized_keys do servidor do modelo restrita ao túnel:
#   restrict,port-forwarding,permitopen="127.0.0.1:11434",command="/usr/bin/false" ssh-ed25519 AAAA... osa-model-tunnel
# known_hosts: sudo -u osa ssh-keyscan -t ed25519 <host> >> /etc/osa/known_hosts (conferir a
# impressão digital no servidor antes).
Host osa-model
    HostName servidor-do-modelo.exemplo
    User osa-modelo
    IdentityFile /etc/osa/model_ed25519
    IdentitiesOnly yes
    UserKnownHostsFile /etc/osa/known_hosts
    StrictHostKeyChecking yes
    BatchMode yes
    LocalForward 127.0.0.1:11434 127.0.0.1:11434
    ExitOnForwardFailure yes
    ServerAliveInterval 30
    ServerAliveCountMax 3
    RequestTTY no
    ForwardAgent no
    ForwardX11 no
