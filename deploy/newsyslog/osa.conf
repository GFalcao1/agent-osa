# Rotação dos logs do OSA no macOS (TASK-112). Instalar: sudo cp deploy/newsyslog/osa.conf /etc/newsyslog.d/
# Bot e worker escrevem o log JSON em OSA_LOG_FILE e o reabrem sozinhos quando o newsyslog o
# renomeia (sem sinal, flag N). Os *.stderr.log só recebem o que escapa antes do log começar.
# Por tamanho (KB), 14 arquivos comprimidos (J), modo 600 e dono osa.
# logfilename                               [owner:group]  mode count size  when  flags
/usr/local/var/log/osa/bot.log               osa:staff      600  14    10240 *     JN
/usr/local/var/log/osa/worker.log            osa:staff      600  14    10240 *     JN
/usr/local/var/log/osa/backup.log            osa:staff      600  14    1024  *     JN
/usr/local/var/log/osa/bot.stderr.log        osa:staff      600  14    1024  *     JN
/usr/local/var/log/osa/worker.stderr.log     osa:staff      600  14    1024  *     JN
