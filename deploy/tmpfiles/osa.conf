# Pasta dos logs do OSA na Core (TASK-113), criada no boot antes dos serviços. O systemd abre os
# arquivos de StandardOutput=append: antes de criar LogsDirectory=, então a pasta tem de existir.
# Instalar: sudo cp deploy/tmpfiles/osa.conf /etc/tmpfiles.d/ && sudo systemd-tmpfiles --create osa.conf
d /var/log/osa 0700 osa osa -
# Os arquivos que o systemd abre em append nascem do osa (senão nascem do root e o logrotate,
# que roda como osa, não consegue truncá-los).
f /var/log/osa/bot.stderr.log 0600 osa osa -
f /var/log/osa/worker.stderr.log 0600 osa osa -
f /var/log/osa/backup.log 0600 osa osa -
