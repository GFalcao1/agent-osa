[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agent-osa"
version = "0.1.0"
description = "Agente local para organização e envio auditável de documentos."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic-settings>=2.7,<3",
]

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/osa"]

[tool.hatch.build.targets.wheel]
packages = ["src/osa"]
