[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agent-osa"
version = "0.1.0"
description = "Agente local para organização e envio auditável de documentos."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "defusedxml>=0.7,<1",
  "fastapi>=0.115,<1",
  "httpcore>=1.0.9,<2",
  # ollama.py swaps HTTPTransport._pool for a deadline-aware pool: widen only after its tests pass.
  "httpx>=0.28,<0.29",
  "jinja2>=3.1,<4",
  "onnxruntime>=1.31,<2",
  "openpyxl>=3.1,<4",
  "pi-heif>=1.4,<2",
  "pillow>=12,<14",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "pypdfium2>=5.14,<6",
  "python-docx>=1.2,<2",
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.9,<1",
  "python-telegram-bot[job-queue]>=22.3,<23",
  "pyyaml>=6,<7",
  "rapidocr>=3.10,<4",
  "sqlalchemy>=2.0,<2.2",
  "structlog>=25.1,<27",
  "typer>=0.15,<1",
  "uvicorn>=0.30,<1",
]

[project.scripts]
osa = "osa.cli:main"
osa-bot = "osa.telegram.app:main"

[dependency-groups]
dev = [
  "mypy>=1.14,<3",
  # The pillow-heif wheels bundle a GPLv2 encoder: dev only, to write the HEIC fixture.
  "pillow-heif>=1.8,<2",
  "pytest>=8.3,<10",
  "reportlab>=4.2,<6",
  "ruff>=0.9,<1",
  "types-openpyxl>=3.1,<4",
  "types-pyyaml>=6,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not integration and not native and not live'"
markers = [
  "integration: requires a disposable PostgreSQL configured by OSA_TEST_DATABASE_URL; run with -m integration",
  "native: requires the target filesystem profile and is not part of the portable suite",
  "live: requires an explicitly configured live provider and is not part of the portable suite",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/osa"]

[[tool.mypy.overrides]]
module = ["pypdfium2.*", "pi_heif.*", "pillow_heif.*", "rapidocr.*", "onnxruntime.*", "defusedxml.*"]
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["src/osa"]
