[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agent-osa"
version = "0.1.0"
description = "Agente local para organização e envio auditável de documentos."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "sqlalchemy>=2.0,<2.2",
  "structlog>=25.1,<27",
  "typer>=0.15,<1",
]

[project.scripts]
osa = "osa.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not integration'"
markers = [
  "integration: requires a disposable PostgreSQL configured by OSA_TEST_DATABASE_URL; run with -m integration",
  "native: requires the target filesystem profile and is not part of the portable suite",
  "live: requires an explicitly configured live provider and is not part of the portable suite",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/osa"]

[tool.hatch.build.targets.wheel]
packages = ["src/osa"]
