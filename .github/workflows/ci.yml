# Gate comum (lint, tipos, suite portável, suite de integração) em todo pull
# request e em push para main. As suites native (share SMB) e live (Ollama)
# não rodam aqui: precisam de ambiente real e ficam no registro de cada task.
#
# Regras deste arquivo:
# - toda action de terceiros é fixada por SHA completo (comentário com a tag);
# - permissões mínimas, sem segredos, só o evento pull_request (nunca o evento com permissões de escrita);
# - uv nunca reescreve uv.lock (UV_LOCKED + --locked);
# - a única rede usada pelos testes é o container PostgreSQL do job de integração
#   (a suite portável bloqueia sockets por conta própria);
# - uma única versão de Python (3.12, o mínimo de requires-python): a matriz
#   só valeria o custo quando houver mais de uma versão suportada.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_LOCKED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        run: uv sync --locked
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .

  hygiene:
    name: Hygiene (lock file, secrets)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: uv.lock is up to date with pyproject.toml
        run: uv lock --check
      - name: No tracked .env or key material
        run: |
          set -euo pipefail
          if git ls-files -z | tr '\0' '\n' | grep -E '(^|/)\.env$|\.(pem|pfx|p12|key)$'; then
            echo "::error::a tracked file looks like a secret or key material"
            exit 1
          fi
          echo "ok: no tracked .env or key files"
      - name: No secret-looking strings in tracked files
        # Deterministic patterns only (no third-party scanner): cloud keys, private
        # key blocks, GitHub/Slack/OpenAI-style tokens and Telegram bot tokens.
        run: |
          set -euo pipefail
          if git grep -nIE \
              -e 'AKIA[0-9A-Z]{16}' \
              -e '-----BEGIN [A-Z ]*PRIVATE KEY-----' \
              -e 'ghp_[A-Za-z0-9]{36}' \
              -e 'github_pat_[A-Za-z0-9_]{22,}' \
              -e 'xox[baprs]-[A-Za-z0-9-]{10,}' \
              -e 'sk-[A-Za-z0-9]{32,}' \
              -e '\b[0-9]{8,10}:[A-Za-z0-9_-]{35}\b' \
              -- . ':!.github/workflows/ci.yml'; then
            echo "::error::a tracked file contains a secret-looking string"
            exit 1
          fi
          echo "ok: no secret-looking strings"

  typecheck:
    name: Type check (mypy strict)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        run: uv sync --locked
      - name: mypy
        run: uv run mypy src/osa

  tests-portable:
    name: Portable tests (no database)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Node.js (LTS) so the theme script tests run instead of skipping
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Portable suite
        # No OSA_* variable is set here on purpose: this job proves the portable
        # suite needs neither a database nor any local configuration.
        run: uv run pytest -q --junitxml="$RUNNER_TEMP/portable.xml"
      - name: Assert tests actually ran
        # pytest exits 5 on an empty collection, but be explicit: zero tests is a
        # failure, and the Node-backed theme tests must have run, not skipped.
        run: |
          set -euo pipefail
          uv run python -I - "$RUNNER_TEMP/portable.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          cases = list(root.iter("testcase"))
          skipped = [c for c in cases if c.find("skipped") is not None]
          theme = [c for c in cases if "theme_script" in (c.get("name") or "")]
          theme_skipped = [c for c in theme if c.find("skipped") is not None]
          print(f"testcases={len(cases)} skipped={len(skipped)} theme={len(theme)}")
          if not cases:
              sys.exit("no tests were collected")
          if not theme or theme_skipped:
              sys.exit("the Node-backed theme tests did not run (is Node.js on PATH?)")
          PY

  tests-integration:
    name: Integration tests (PostgreSQL 17)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # CI-only, fictional, throwaway credentials for the disposable service
      # container. They exist nowhere else and protect nothing.
      OSA_CI_DB_PASSWORD: ci-only-fictional-osa-pw-0000
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-fictional-bootstrap-pw-0000
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Node.js (LTS)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Create a non-superuser role with CREATEDB and the osa_test database
        # The suite creates and drops osa_test_mig_* databases itself (CREATEDB) and
        # applies `alembic upgrade head`; it must not need SUPERUSER, so CI runs it
        # as a plain role that merely owns osa_test.
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: ci-only-fictional-bootstrap-pw-0000
        run: |
          set -euo pipefail
          uv run python -I - <<'PY'
          import os

          import psycopg
          from psycopg import sql

          password = os.environ["OSA_CI_DB_PASSWORD"]
          with psycopg.connect(autocommit=True) as conn:
              conn.execute(
                  sql.SQL("CREATE ROLE osa LOGIN NOSUPERUSER CREATEDB PASSWORD {}").format(
                      sql.Literal(password)
                  )
              )
              conn.execute("CREATE DATABASE osa_test OWNER osa")
              row = conn.execute(
                  "SELECT rolsuper, rolcreatedb FROM pg_roles WHERE rolname = 'osa'"
              ).fetchone()
          assert row == (False, True), row
          print("role osa: superuser=False createdb=True; database osa_test created")
          PY
      - name: Integration suite
        # The DB name guard in tests/integration/conftest.py accepts only osa_test
        # or osa_test_<suffix>, with a host and without query parameters.
        run: |
          set -euo pipefail
          export OSA_TEST_DATABASE_URL="postgresql://osa:${OSA_CI_DB_PASSWORD}@127.0.0.1:5432/osa_test"
          uv run pytest -m integration -q
